<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Futebol de Cegos: Peneira</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <a-scene
      webxr="referenceSpaceType: local-floor"
      renderer="colorManagement: true"
      background="color: #1a1d22"
    >
      <a-entity id="rig" position="0 0 0" kicker controles-jogador>
        <a-entity
          id="camera"
          camera
          look-controls="pointerLockEnabled: true"
          wasd-controls="acceleration: 16"
          position="0 1.6 0"
          debug-hud
        ></a-entity>
        <a-entity id="mao-esquerda" meta-touch-controls="hand: left"></a-entity>
        <a-entity id="mao-direita" meta-touch-controls="hand: right"></a-entity>
      </a-entity>

      <a-entity id="gol" goal-zones></a-entity>

      <a-entity id="estadio" estadio></a-entity>

      <a-entity id="area" play-area></a-entity>

      <a-entity id="bola" ball></a-entity>

      <a-entity id="vestiario" vestiario></a-entity>

      <a-entity id="instrucoes" instrucoes dicas-tutorial></a-entity>

      <a-entity id="venda-efeito" blindfold></a-entity>

      <a-entity id="entrada-campo" entrada-campo></a-entity>

      <a-entity id="colisao" colisao></a-entity>

      <a-light type="ambient" intensity="0.6"></a-light>
      <a-light type="directional" intensity="0.8" position="1 4 2"></a-light>
    </a-scene>
  </body>
</html>
